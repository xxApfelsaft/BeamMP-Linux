name: Automated Release Build

on:
  push:
    tags:
      - 'v*' # Triggered immer, wenn du ein Tag wie v1.0.0 pushst
  workflow_dispatch: # Erlaubt es dir auch, den Build manuell auf GitHub zu starten

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Nötig, damit GitHub Actions ein Release erstellen darf

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git perl

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Clone & Build BeamMP-Launcher
        run: |
          export VCPKG_ROOT="$(pwd)/vcpkg"
          export PATH=$VCPKG_ROOT:$PATH
          
          git clone https://github.com/BeamMP/BeamMP-Launcher.git
          cd BeamMP-Launcher
          
          # Neuestes offizielles BeamMP-Tag holen
          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          echo "Building BeamMP-Launcher version: $LATEST_TAG"
          git checkout $LATEST_TAG
          
          # CMake konfigurieren & bauen (ohne CMAKE_BUILD_TYPE=Release gegen den Server-Bug)
          cmake . -B bin -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-linux
          cmake --build bin --parallel

      - name: Prepare Binary
        run: |
          mkdir -p release_assets
          cp BeamMP-Launcher/bin/BeamMP-Launcher release_assets/BeamMP-Launcher

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_assets/BeamMP-Launcher
          name: "BeamMP Linux Launcher ${{ github.ref_name }}"
          body: |
            Automated build of the native BeamMP Linux Launcher.
            
            **Installation:**
            1. Download `BeamMP-Launcher` below.
            2. Run `chmod +x BeamMP-Launcher` in terminal.
            3. Run `BROWSER=/usr/bin/xdg-open ./BeamMP-Launcher`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
