name: Automated Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git perl

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Build Launcher
        run: |
          export VCPKG_ROOT="$(pwd)/vcpkg"
          export PATH=$VCPKG_ROOT:$PATH
          
          git clone https://github.com/BeamMP/BeamMP-Launcher.git
          cd BeamMP-Launcher
          
          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          git checkout $LATEST_TAG
          
          cmake . -B bin -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-linux
          cmake --build bin --parallel

      - name: Copy Output
        run: |
          mkdir -p release_assets
          cp BeamMP-Launcher/bin/BeamMP-Launcher release_assets/BeamMP-Launcher

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release_assets/BeamMP-Launcher
          name: "BeamMP Linux Launcher ${{ github.ref_name }}"
          body: |
            BeamMP Linux Launcher Build.
            
            1. Download `BeamMP-Launcher`
            2. `chmod +x BeamMP-Launcher`
            3. `BROWSER=/usr/bin/xdg-open ./BeamMP-Launcher`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Launcher-Linux
          path: release_assets/BeamMP-Launcher
